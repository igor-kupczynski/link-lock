<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security headers via meta (the host serves static files only).
       Note: HSTS, X-Content-Type-Options and frame-ancestors are header-only
       and cannot be enforced via meta; add them at the CDN/edge if available. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <meta name="referrer" content="no-referrer" />

  <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="stylesheet" href="../style.css" type="text/css" />

  <title data-i18n-title="create.title">Create a locked link</title>

  <script type="text/javascript" src="../b64.js"></script>
  <script type="text/javascript" src="../api.js"></script>
  <script type="text/javascript" src="../i18n.js"></script>
  <script type="text/javascript" src="create.js"></script>
</head>

<body>
  <div class="lang-switch">
    <button type="button" data-lang="en" data-i18n="lang.en">EN</button>
    <button type="button" data-lang="pl" data-i18n="lang.pl">PL</button>
  </div>

  <noscript>
  <div class="red-border">
    <p>This page needs JavaScript to encrypt the link in your browser. Please enable JavaScript.</p>
  </div>
  </noscript>

  <h1 data-i18n="create.heading">Encrypt a link</h1>

  <div class="error red-border hidden">
    <p id="errortext"></p>
  </div>

  <hr />

  <div class="form">
    <div class="labeled-input">
      <label for="url" data-i18n="create.url">destination link</label>
      <input type="url" id="url" data-i18n-placeholder="create.urlPlaceholder" placeholder="https://" required />
    </div>

    <div class="split-row">
      <div class="labeled-input password">
        <label for="password" data-i18n="create.password">password</label>
        <input type="text" id="password" />
      </div>
      <div class="labeled-input confirm-password">
        <label for="confirm-password" data-i18n="create.confirm">confirm password</label>
        <input type="text" id="confirm-password" />
      </div>
    </div>
    <button type="button" id="generate" class="btn-secondary" data-i18n="create.generate">Generate password</button>

    <button id="encrypt" class="btn-primary" data-i18n="create.encrypt">Encrypt link</button>
  </div>

  <hr />

  <div class="output">
    <label for="output" data-i18n="create.output">locked link</label>
    <input type="text" id="output" readonly />
    <button id="copy" data-i18n="create.copy">Copy</button>
    <a href="" id="open" target="_blank" rel="noopener noreferrer"><button data-i18n="create.open">Open in new tab</button></a>
    <p class="alert"></p>
  </div>
</body>

</html>
