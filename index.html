<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security headers via meta (the host serves static files only).
       Note: HSTS, X-Content-Type-Options and frame-ancestors are header-only
       and cannot be enforced via meta; add them at the CDN/edge if available. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <meta name="referrer" content="no-referrer" />

  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" type="text/css" />

  <title data-i18n-title="unlock.title">Unlock link</title>

  <script type="text/javascript" src="b64.js"></script>
  <script type="text/javascript" src="api.js"></script>
  <script type="text/javascript" src="i18n.js"></script>
  <script type="text/javascript" src="index.js"></script>
</head>

<body>
  <div class="lang-switch">
    <button type="button" data-lang="en" data-i18n="lang.en">EN</button>
    <button type="button" data-lang="pl" data-i18n="lang.pl">PL</button>
  </div>

  <noscript>
  <div class="red-border">
    <p>This page needs JavaScript to decrypt the link in your browser. Please enable JavaScript.</p>
  </div>
  </noscript>

  <div class="form hidden">
    <p data-i18n="unlock.prompt">Enter the password to unlock this link.</p>

    <label for="password" data-i18n="unlock.password">password</label>
    <input type="password" id="password" autofocus />
    <button id="unlockbutton" class="btn-primary" data-i18n="unlock.button">Unlock</button>
    <button type="button" id="previewbutton" class="btn-secondary" data-i18n="unlock.preview">Preview</button>

    <div id="preview" class="preview hidden">
      <label for="preview-url" data-i18n="unlock.previewLabel">This link points to:</label>
      <input type="text" id="preview-url" readonly />
      <a href="" id="preview-open" target="_blank" rel="noopener noreferrer"><button data-i18n="unlock.open">Open</button></a>
    </div>
  </div>

  <div class="error red-border hidden">
    <p id="errortext"></p>
    <button id="tryagain" data-i18n="btn.tryAgain">Try again</button>
  </div>
</body>

</html>
